<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cozinha">
<title>Cozinha</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-user-select: none; user-select: none; }
html, body { height: 100%; overflow: hidden; background: #0a0f1a; color: #fff;
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.tap { cursor: pointer; }
.hidden { display: none !important; }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; opacity: .75; }
.card { border-radius: 20px; padding: 16px 18px; position: relative; overflow: hidden; }

#app { display: -webkit-flex; display: flex; width: 100%; height: 100%; padding: 14px; }

/* ---------- Coluna esquerda ---------- */
.left { -webkit-flex: 0 0 32%; flex: 0 0 32%; margin-right: 14px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-width: 0; }
.hero { -webkit-flex: 1.2; flex: 1.2; position: relative; border-radius: 20px; overflow: hidden; background: #1a1a1a; }
.slide { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0; -webkit-transition: opacity 1.2s ease; transition: opacity 1.2s ease;
  background-size: cover; background-position: center; }
.slide.on { opacity: 1; }
.slide .emoji { position: absolute; right: 10px; top: 30%; font-size: 120px; line-height: 1; }
.slide .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 60%;
  background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.85) 100%); }
.slide .info { position: absolute; left: 20px; right: 20px; bottom: 30px; }
.slide .kicker { font-size: 13px; opacity: .85; margin-bottom: 5px; }
.slide .name { font-size: 26px; font-weight: 600; line-height: 1.1; margin-bottom: 6px; }
.slide .hint { font-size: 13px; font-style: italic; opacity: .7; }
.clockbox { position: absolute; left: 20px; top: 16px; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
#clock { font-size: 56px; font-weight: 300; letter-spacing: -1px; line-height: 1; }
#date { font-size: 16px; margin-top: 5px; }
#miniWeather { font-size: 16px; margin-top: 3px; }
.dots { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; }
.dots span { display: inline-block; width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.4); margin: 0 3px; }
.dots span.on { background: #fff; width: 14px; }

.meal { -webkit-flex: 1; flex: 1; margin-top: 14px; background: linear-gradient(160deg, #4a3326 0%, #2b1f18 100%);
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.meal-top { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.meal-top .label { -webkit-flex: 1; flex: 1; color: #f3c58f; opacity: 1; }
.meal-tema { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: rgba(255,255,255,.14); white-space: nowrap; }
.meal h3 { font-size: 24px; font-weight: 600; margin: 4px 0 8px; }
.meal ul { list-style: none; -webkit-flex: 1; flex: 1; overflow: hidden; min-height: 0; }
.meal li { font-size: 14px; line-height: 1.3; margin-bottom: 6px; padding-left: 12px; position: relative; opacity: .95; }
.meal li:before { content: ""; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 3px; background: #e0a565; }
.meal-foot { font-size: 13px; margin-top: 6px; opacity: .75; font-style: italic; }
.meal-foot.prep { opacity: 1; font-style: normal; font-weight: 600; color: #ffd9a8; background: rgba(255,255,255,.1); border-radius: 10px; padding: 7px 10px; }

/* ---------- Coluna direita ---------- */
.right { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-width: 0; }
.meds { -webkit-flex: 1.65; flex: 1.65; margin-bottom: 14px; background: linear-gradient(135deg, #1b6a8f 0%, #134a6b 55%, #0f3a57 100%);
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; padding-bottom: 14px; }
.meds-head { display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; margin-bottom: 12px; }
.meds-head .l { -webkit-flex: 1; flex: 1; }
#medsSummary { font-size: 21px; font-weight: 600; margin-top: 2px; }
.meds-head .r { text-align: right; }
.hist-link { font-size: 13px; font-weight: 600; opacity: .85; margin-bottom: 7px; }
.prog { width: 140px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; margin-bottom: 6px; }
#progBar { height: 100%; width: 0; background: #5ee39a; border-radius: 4px; -webkit-transition: width .4s; transition: width .4s; }
#slots { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; min-height: 0; }
.slot { -webkit-flex: 1; flex: 1; min-width: 0; margin-right: 7px; background: rgba(0,0,0,.16); border-radius: 14px; padding: 9px 6px 6px; border: 2px solid transparent; }
.slot:last-child { margin-right: 0; }
.slot.current { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.45); }
.slot.late { border-color: #f5b041; }
.slot-head { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-bottom: 7px; padding: 0 2px; }
.slot-head .i { font-size: 15px; margin-right: 4px; }
.slot-head .n { font-size: 15px; font-weight: 700; -webkit-flex: 1; flex: 1; white-space: nowrap; }
.badge { font-size: 9px; font-weight: 800; padding: 3px 5px; border-radius: 8px; background: rgba(255,255,255,.2); letter-spacing: .3px; }
.slot.current .badge { background: #fff; color: #134a6b; }
.slot.late .badge { background: #f5b041; color: #3a2600; }
.pill { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: rgba(255,255,255,.1); border-radius: 11px;
  padding: 6px 6px; margin-bottom: 6px; -webkit-transition: background .25s; transition: background .25s; }
.pill .chk { -webkit-flex: 0 0 22px; flex: 0 0 22px; height: 22px; border-radius: 11px; border: 2px solid rgba(255,255,255,.7); margin-right: 6px;
  text-align: center; line-height: 18px; font-size: 13px; font-weight: 800; color: transparent; }
.pill .txt { min-width: 0; -webkit-flex: 1; flex: 1; }
.pill .pn { font-size: 14px; font-weight: 600; line-height: 1.15; }
.pill .pd { font-size: 11px; opacity: .8; margin-top: 2px; line-height: 1.2; }
.pill.taken { background: rgba(94,227,154,.25); }
.pill.taken .chk { background: #5ee39a; border-color: #5ee39a; color: #0d3b24; }
.pill.taken .pd { color: #b9f5d2; opacity: 1; font-weight: 600; }
.pill.armed { background: rgba(245,176,65,.4); }
.pill.off { opacity: .38; }
.pill.off .chk { border-style: dashed; }
.all-btn { text-align: center; font-size: 12px; font-weight: 700; padding: 7px 4px; border-radius: 10px; border: 1px dashed rgba(255,255,255,.5); opacity: .9; }

.row { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; min-height: 0; }
.weather { -webkit-flex: 1; flex: 1; margin-right: 14px; background: linear-gradient(165deg, #6fb2e6 0%, #3a7fbe 60%, #2b6599 100%); }
.weather.night { background: linear-gradient(165deg, #2d3f6b 0%, #1d2a4d 60%, #141d38 100%); }
.w-main { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-top: 4px; }
.w-ico { font-size: 44px; margin-right: 8px; }
.w-temp { font-size: 48px; font-weight: 300; letter-spacing: -1px; }
.w-desc { font-size: 14px; margin-top: 1px; }
.w-mm { font-size: 12px; opacity: .85; margin-top: 3px; }
.w-hours { display: -webkit-flex; display: flex; margin-top: 9px; border-top: 1px solid rgba(255,255,255,.25); padding-top: 8px; }
.w-h { -webkit-flex: 1; flex: 1; text-align: center; font-size: 12px; }
.w-h .e { font-size: 18px; margin: 2px 0; }
.w-h .p { font-size: 10px; opacity: .8; }
.w-upd { position: absolute; right: 16px; top: 17px; font-size: 10px; opacity: .65; }

.timer { -webkit-flex: 1; flex: 1; background: #1b2232; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.t-grid { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; margin: 8px -4px 0; -webkit-flex: 1; flex: 1; }
.t-row { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; }
.t-btn { -webkit-flex: 1; flex: 1; padding: 4px; display: -webkit-flex; display: flex; }
.t-btn div { -webkit-flex: 1; flex: 1; background: #2b3550; border-radius: 12px; display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; font-size: 15px; font-weight: 600; white-space: nowrap; }
.t-run { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; }
#tLeft { font-size: 56px; font-weight: 300; text-align: center; letter-spacing: -1px; }
.t-sub { text-align: center; font-size: 12px; opacity: .7; margin-bottom: 8px; }
.t-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; margin: 0 6px 10px; }
#tBar { height: 100%; background: #f5b041; width: 100%; }
.t-acts { display: -webkit-flex; display: flex; }
.t-act { -webkit-flex: 1; flex: 1; margin: 0 3px; background: #2b3550; border-radius: 12px; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 600; }
.t-act.stop { background: #5a2a2a; }
.paused #tLeft { opacity: .45; }

/* ---------- Modal ---------- */
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7); z-index: 10; padding: 26px 50px; }
.sheet { position: relative; background: #fbf8f3; color: #2a2420; border-radius: 22px; height: 100%; overflow: hidden;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.sheet-top { -webkit-flex: 0 0 auto; flex: 0 0 auto; padding: 22px 28px 16px; color: #fff; position: relative; background: #2b1f18; }
.sheet-top .e { position: absolute; right: 122px; top: 6px; font-size: 76px; }
.sheet-top h2 { font-size: 27px; font-weight: 600; padding-right: 200px; }
.sheet-top p { font-size: 14px; opacity: .9; margin-top: 4px; padding-right: 150px; }
.sheet-body { -webkit-flex: 1; flex: 1; min-height: 0; overflow-y: scroll; -webkit-overflow-scrolling: touch; padding: 18px 28px 28px; }
.cols { display: -webkit-flex; display: flex; }
.cols .c1 { -webkit-flex: 0 0 40%; flex: 0 0 40%; padding-right: 24px; }
.cols .c2 { -webkit-flex: 1; flex: 1; }
.sheet-body h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: #9a6b3c; margin: 0 0 9px; }
.sheet-body li { font-size: 16px; line-height: 1.4; margin-bottom: 8px; }
.sheet-body ul { list-style: none; }
.sheet-body ul li:before { content: "• "; color: #c58a4a; }
.sheet-body ol { padding-left: 22px; }
.chips span { display: inline-block; font-size: 13px; padding: 5px 10px; border-radius: 14px; background: #efe5d7; margin: 0 6px 6px 0; }
.note { font-size: 14px; line-height: 1.4; background: #f3ead9; border-radius: 12px; padding: 10px 14px; margin-top: 14px; color: #6b4a26; }
.close, .back { position: absolute; top: 14px; width: 42px; height: 42px; border-radius: 21px; background: rgba(0,0,0,.35); color: #fff;
  text-align: center; line-height: 42px; font-size: 19px; z-index: 2; }
.close { right: 14px; }
.back { right: 64px; font-size: 24px; line-height: 40px; }

.tabs { display: -webkit-flex; display: flex; margin-top: 12px; }
.tabs div { -webkit-flex: 1; flex: 1; text-align: center; padding: 8px 0; font-size: 14px; font-weight: 600; border-radius: 10px; margin-right: 6px; background: rgba(255,255,255,.12); }
.tabs div:last-child { margin-right: 0; }
.tabs div.sel { background: #fff; color: #2b1f18; }
.tabs div.hoje { box-shadow: inset 0 -3px 0 #e0a565; }
.mrow { display: -webkit-flex; display: flex; padding: 12px 0; border-bottom: 1px solid #ece2d3; }
.mrow:last-child { border-bottom: 0; }
.mrow.now { background: #fff3e0; margin: 0 -14px; padding: 12px 14px; border-radius: 12px; border-bottom-color: transparent; }
.mrow .h { -webkit-flex: 0 0 74px; flex: 0 0 74px; font-size: 17px; font-weight: 700; color: #9a6b3c; }
.mrow .h small { display: block; font-size: 11px; font-weight: 600; color: #8a7a6a; text-transform: uppercase; margin-top: 2px; }
.mrow .b { -webkit-flex: 1; flex: 1; }
.mrow .b div.it { font-size: 15px; line-height: 1.35; margin-bottom: 3px; }
.mrow .tags { margin-top: 5px; }
.mrow .tags span { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: #8a6a48; background: #f1e6d6; padding: 3px 7px; border-radius: 8px; margin: 0 4px 3px 0; }
.rbtn { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 700; color: #fff; background: #b8743a; padding: 6px 12px; border-radius: 14px; }

.hist { width: 100%; border-collapse: collapse; }
.hist th { font-size: 12px; color: #8a7a6a; font-weight: 700; padding: 6px 4px; text-align: center; }
.hist th.l, .hist td.l { text-align: left; }
.hist td { font-size: 14px; padding: 6px 4px; text-align: center; border-top: 1px solid #ece2d3; }
.hist td.l small { color: #9a8a7a; }
.hist .y { color: #fff; background: #36b37e; border-radius: 10px; display: inline-block; min-width: 46px; padding: 2px 0; font-size: 12px; font-weight: 700; }
.hist .n { color: #d0c2b0; }
.hist .x { color: #e0d6c8; }
.hist th.today { color: #2a2420; }

/* ---------- Alarme ---------- */
.alarm { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; background: #c0392b; text-align: center;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
  -webkit-animation: flash 1s infinite; animation: flash 1s infinite; }
.alarm .big { font-size: 120px; }
.alarm .t { font-size: 56px; font-weight: 700; margin-top: 10px; }
.alarm .s { font-size: 22px; opacity: .85; margin-top: 10px; }
@-webkit-keyframes flash { 0%,100% { background: #c0392b; } 50% { background: #e67e22; } }
@keyframes flash { 0%,100% { background: #c0392b; } 50% { background: #e67e22; } }

/* ---------- Retrato ---------- */
@media (orientation: portrait) {
  #app { -webkit-flex-direction: column; flex-direction: column; }
  .left { -webkit-flex: 0 0 34%; flex: 0 0 34%; -webkit-flex-direction: row; flex-direction: row; margin-right: 0; margin-bottom: 14px; }
  .meal { margin-top: 0; margin-left: 14px; }
  .modal { padding: 36px 20px; }
  .cols { display: block; }
  .cols .c1 { padding-right: 0; margin-bottom: 16px; }
}
</style>
</head>
<body>

<div id="app">
  <div class="left">
    <div class="hero tap" id="hero">
      <div id="slides"></div>
      <div class="clockbox">
        <div id="clock">--:--</div>
        <div id="date"></div>
        <div id="miniWeather"></div>
      </div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="card meal tap" id="meal"></div>
  </div>

  <div class="right">
    <div class="card meds">
      <div class="meds-head">
        <div class="l">
          <div class="label">Remédios e suplementos</div>
          <div id="medsSummary"></div>
        </div>
        <div class="r">
          <div class="hist-link tap" id="histLink">Últimos 7 dias ›</div>
          <div class="prog"><div id="progBar"></div></div>
        </div>
      </div>
      <div id="slots"></div>
    </div>

    <div class="row">
      <div class="card weather" id="weather">
        <div class="label">Tempo</div>
        <div class="w-desc" style="margin-top:20px;opacity:.8">Carregando previsão…</div>
      </div>
      <div class="card timer" id="timerCard"></div>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

<div id="alarm" class="alarm hidden tap">
  <div>
    <div class="big">⏰</div>
    <div class="t">Timer acabou!</div>
    <div class="s">Toque em qualquer lugar para parar</div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO
   ===================================================================== */
var CONFIG = {
  cidade: 'Botafogo, Rio',
  lat: -22.95,
  lon: -43.18,
  segundosPorReceita: 25,

};

  try { var v = window.localStorage.getItem(k); return v === null ? (memStore[k] || null) : v; }

}
function lsSet(k, v) {
  memStore[k] = v;

}

  }
  for (i = 0; i < ORDEM_RECEITAS.length; i++) {

  if (r.prep && r.prep.length) html += '<h4>Modo de preparo</h4>' + listHtml(r.prep, 'ol');
  if (r.extra) {
    html += '<h4 style="margin-top:16px">' + esc(r.extraT) + '</h4><div class="chips">';
    for (i = 0; i < r.extra.length; i++) html += '<span>' + esc(r.extra[i]) + '</span>';
    html += '</div>';
  }
  if (r.nota) html += '<div class="note">' + esc(r.nota) + '</div>';
  html += '</div></div></div>';
  openSheet(html);
  if (backTo !== undefined) $('sheetBack').onclick = function () { openMenu(backTo); };
}

/* =====================================================================
   Cardápio: próxima refeição + semana
   ===================================================================== */
function mealNow(now) {
  var dow = now.getDay(), ref = CARDAPIO[dow].ref, nm = now.getHours() * 60 + now.getMinutes(), i, t;
  for (i = 0; i < ref.length; i++) {
    t = toMin(ref[i][0]);
    if (nm < t + 45) return { dow: dow, i: i, quando: nm >= t ? 'Agora' : 'Próxima refeição' };
  }
  return { dow: (dow + 1) % 7, i: 0, quando: 'Amanhã cedo' };
}

function prepHint(now) {
  if (now.getHours() < 17) return '';
  var t = CARDAPIO[(now.getDay() + 1) % 7].ref, i, out = [];
  for (i = 0; i < t.length; i++) {
    if (t[i][4] === 'oats') out.push('overnight oats');
    if (t[i][4] === 'pudim') out.push('pudim de chia');
  }
  return out.length ? '🌙 Prepare hoje para amanhã: ' + out.join(' e ') : '';
}

function renderMeal() {
  var now = new Date(), m = mealNow(now), r = CARDAPIO[m.dow].ref[m.i], html, i, hint = prepHint(now);
  html = '<div class="meal-top"><div class="label">' + m.quando + ' · ' + hLabel(r[0]) + '</div><div class="meal-tema">' + esc(CARDAPIO[m.dow].tema) + '</div></div>';
  html += '<h3>' + esc(r[1]) + '</h3><ul>';
  for (i = 0; i < r[2].length; i++) html += '<li>' + esc(r[2][i]) + '</li>';
  html += '</ul>';
  html += hint ? '<div class="meal-foot prep">' + esc(hint) + '</div>' : '<div class="meal-foot">Toque para ver o cardápio da semana</div>';
  $('meal').innerHTML = html;
}

var TAB_ORDER = [1, 2, 3, 4, 5, 6, 0];
function openMenu(dow) {
  var now = new Date(), today = now.getDay(), cur = mealNow(now), d = CARDAPIO[dow], html, i, k, r, isNow;
  html = '<div class="sheet-top"><h2>Cardápio de ' + DIAS[dow] + '</h2><p>' + esc(d.tema) + ' · Plano alimentar da Carine</p>' +
    '<div class="close tap" id="sheetClose">✕</div><div class="tabs">';
  for (i = 0; i < TAB_ORDER.length; i++) {
    k = TAB_ORDER[i];
    html += '<div class="tap' + (k === dow ? ' sel' : '') + (k === today ? ' hoje' : '') + '" data-d="' + k + '">' + DIAS_CURTOS[k] + '</div>';
  }
  html += '</div></div><div class="sheet-body" id="menuBody">';
  for (i = 0; i < d.ref.length; i++) {
    r = d.ref[i];
    isNow = cur.dow === dow && cur.i === i;
    html += '<div class="mrow' + (isNow ? ' now' : '') + '"><div class="h">' + hLabel(r[0]) + '<small>' + esc(r[1]) + '</small></div><div class="b">';
    for (k = 0; k < r[2].length; k++) html += '<div class="it">' + esc(r[2][k]) + '</div>';
    html += '<div class="tags">';
    for (k = 0; k < r[3].length; k++) html += '<span>' + esc(r[3][k]) + '</span>';
    html += '</div>';
    if (r[4]) html += '<div class="rbtn tap" data-r="' + r[4] + '">Ver receita</div>';
    html += '</div></div>';
  }
  html += '</div>';
  openSheet(html);

  var tabs = $('sheet').getElementsByClassName('tabs')[0].childNodes;
  for (i = 0; i < tabs.length; i++) {
    tabs[i].onclick = (function (dd) { return function () { openMenu(dd); }; })(parseInt(tabs[i].getAttribute('data-d'), 10));
  }
  var rb = $('menuBody').getElementsByClassName('rbtn');
  for (i = 0; i < rb.length; i++) {
    rb[i].onclick = (function (rid) { return function () { openRecipe(rid, dow, dow); }; })(rb[i].getAttribute('data-r'));
  }
}

/* =====================================================================
   Remédios
   ===================================================================== */
var undoArmed = {};

function getTaken(key) {
  var raw = lsGet('cozinha-meds-' + key);
  if (!raw) return {};
  try { return JSON.parse(raw) || {}; } catch (e) { return {}; }
}
function setTaken(key, obj) { lsSet('cozinha-meds-' + key, JSON.stringify(obj)); }

function isActive(med, d) {
  if (med.alternado) {
    var a = med.alternado.split('-');
    var diff = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(+a[0], +a[1] - 1, +a[2])) / 86400000);
    return ((diff % 2) + 2) % 2 === 0;
  }
  if (med.dias) return med.dias.indexOf(d.getDay()) >= 0;
  return true;
}

function currentPeriodIndex(now) {
  var h = now.getHours(), idx = 0, i;
  for (i = 0; i < PERIODOS.length; i++) if (h >= PERIODOS[i].inicio) idx = i;
  return idx;
}

function makeToggle(id) {
  return function () {
    unlockAudio();
    var key = dayKey(new Date()), taken = getTaken(key);
    if (taken[id]) {
      if (undoArmed[id]) { delete taken[id]; delete undoArmed[id]; }
      else {
        undoArmed[id] = true;
        setTimeout(function () { if (undoArmed[id]) { delete undoArmed[id]; renderMeds(); } }, 3500);
      }
    } else {
      taken[id] = hhmm(new Date());
    }
    setTaken(key, taken);
    renderMeds();
  };
}

function makeMarkAll(periodId) {
  return function () {
    unlockAudio();
    var now = new Date(), key = dayKey(now), taken = getTaken(key), i, med, t = hhmm(now);
    for (i = 0; i < REMEDIOS.length; i++) {
      med = REMEDIOS[i];
      if (med.periodo === periodId && isActive(med, now) && !taken[med.id]) taken[med.id] = t;
    }
    setTaken(key, taken);
    renderMeds();
  };
}

function renderMeds() {
  var now = new Date(), key = dayKey(now), taken = getTaken(key);
  var cur = currentPeriodIndex(now), wrap = $('slots'), total = 0, done = 0;
  var p, m, col, list, el, pend, badge, med, status, cls, btn;
  wrap.innerHTML = '';

  for (p = 0; p < PERIODOS.length; p++) {
    col = document.createElement('div');
    list = document.createElement('div');
    pend = 0;

    for (m = 0; m < REMEDIOS.length; m++) {
      med = REMEDIOS[m];
      if (med.periodo !== PERIODOS[p].id) continue;
      el = document.createElement('div');
      if (!isActive(med, now)) {
        el.className = 'pill off';
        status = med.alternado ? 'Hoje não · amanhã sim' : 'Hoje não';
      } else {
        total++;
        if (taken[med.id]) {
          done++;
          cls = undoArmed[med.id] ? 'pill tap taken armed' : 'pill tap taken';
          status = undoArmed[med.id] ? 'Toque de novo p/ desmarcar' : 'Tomado às ' + taken[med.id];
        } else {
          pend++;
          cls = 'pill tap';
          status = med.dose;
        }
        el.className = cls;
        el.onclick = makeToggle(med.id);
      }
      el.innerHTML = '<div class="chk">✓</div><div class="txt"><div class="pn">' + esc(med.nome) + '</div><div class="pd">' + esc(status) + '</div></div>';
      list.appendChild(el);
    }

    if (pend >= 2) {
      btn = document.createElement('div');
      btn.className = 'all-btn tap';
      btn.innerHTML = 'Tomei todos';
      btn.onclick = makeMarkAll(PERIODOS[p].id);
      list.appendChild(btn);
    }

    col.className = 'slot';
    badge = '';
    if (p === cur) { col.className += ' current'; badge = '<span class="badge">AGORA</span>'; }
    if (p < cur && pend > 0) { col.className += ' late'; badge = '<span class="badge">FALTA</span>'; }
    if (pend === 0 && p <= cur) badge = '<span class="badge">✓</span>';

    col.innerHTML = '<div class="slot-head"><span class="i">' + PERIODOS[p].icone + '</span><span class="n">' + PERIODOS[p].nome + '</span>' + badge + '</div>';
    col.appendChild(list);
    wrap.appendChild(col);
  }

  $('medsSummary').innerHTML = (done === total && total > 0) ? 'Tudo tomado hoje ✓' : done + ' de ' + total + ' tomados hoje';
  $('progBar').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
}

function openHistory() {
  var days = [], i, j, d, html, med, taken, cell, today = dayKey(new Date());
  for (i = 6; i >= 0; i--) { d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  html = '<div class="sheet-top" style="background:#134a6b"><h2>Últimos 7 dias</h2><p>Horário em que cada item foi marcado</p><div class="close tap" id="sheetClose">✕</div></div>';
  html += '<div class="sheet-body"><table class="hist"><tr><th class="l"></th>';
  for (j = 0; j < days.length; j++) html += '<th' + (dayKey(days[j]) === today ? ' class="today"' : '') + '>' + DIAS_CURTOS[days[j].getDay()] + '<br>' + pad(days[j].getDate()) + '</th>';
  html += '</tr>';
  for (i = 0; i < REMEDIOS.length; i++) {
    med = REMEDIOS[i];
    html += '<tr><td class="l">' + esc(med.nome) + ' <small>· ' + PERIODOS[periodIdx(med.periodo)].nome + '</small></td>';
    for (j = 0; j < days.length; j++) {
      taken = getTaken(dayKey(days[j]));
      if (!isActive(med, days[j])) cell = '<span class="x">–</span>';
      else if (taken[med.id]) cell = '<span class="y">' + taken[med.id] + '</span>';
      else cell = '<span class="n">○</span>';
      html += '<td>' + cell + '</td>';
    }
    html += '</tr>';
  }
  html += '</table></div>';
  openSheet(html);
}
function periodIdx(id) { var i; for (i = 0; i < PERIODOS.length; i++) if (PERIODOS[i].id === id) return i; return 0; }

function cleanupOldDays() {
  try {
    var limit = new Date(); limit.setDate(limit.getDate() - 30);
    var lk = 'cozinha-meds-' + dayKey(limit), i, k, toDel = [];
    for (i = 0; i < window.localStorage.length; i++) {
      k = window.localStorage.key(i);
      if (k && k.indexOf('cozinha-meds-') === 0 && k < lk) toDel.push(k);
    }
    for (i = 0; i < toDel.length; i++) window.localStorage.removeItem(toDel[i]);
  } catch (e) {}
}

/* =====================================================================
   Tempo (Open-Meteo, sem chave)
   ===================================================================== */
function wInfo(code, night) {
  if (code === 0) return night ? ['🌙', 'Céu limpo'] : ['☀️', 'Ensolarado'];
  if (code === 1) return night ? ['🌙', 'Poucas nuvens'] : ['🌤', 'Poucas nuvens'];
  if (code === 2) return night ? ['☁️', 'Parcialmente nublado'] : ['⛅', 'Parcialmente nublado'];
  if (code === 3) return ['☁️', 'Nublado'];
  if (code === 45 || code === 48) return ['🌫', 'Neblina'];
  if (code >= 51 && code <= 57) return ['🌦', 'Garoa'];
  if (code >= 61 && code <= 67) return ['🌧', 'Chuva'];
  if (code >= 80 && code <= 82) return ['🌦', 'Pancadas de chuva'];
  if (code >= 95) return ['⛈', 'Trovoadas'];
  return ['🌡', '—'];
}

function xhrGet(url, ok, fail) {
  var x = new XMLHttpRequest(), finished = false;
  function f() { if (!finished) { finished = true; fail(); } }
  x.open('GET', url, true);
  x.timeout = 15000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || finished) return;
    if (x.status === 200) {
      try { var d = JSON.parse(x.responseText); finished = true; ok(d); } catch (e) { f(); }
    } else { f(); }
  };
  x.ontimeout = f;
  try { x.send(); } catch (e) { f(); }
}

function loadWeather() {
  var q = '://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
    '&current=temperature_2m,weather_code,is_day' +
    '&hourly=temperature_2m,weather_code,precipitation_probability' +
    '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&timezone=America%2FSao_Paulo&forecast_days=3';
  function ok(d) {
    if (!d || !d.hourly) { fail(); return; }
    d._upd = (d.current && d.current.time) ? d.current.time.substr(11, 5) : hhmm(new Date());
    lsSet('cozinha-weather', JSON.stringify(d));
    renderWeather(d);
  }
  function fail() {
    var cached = lsGet('cozinha-weather');
    if (cached) { try { renderWeather(JSON.parse(cached)); return; } catch (e) {} }
    $('weather').innerHTML = '<div class="label">Tempo</div><div class="w-desc" style="margin-top:20px">Previsão indisponível.<br>Verifique o Wi-Fi.</div>';
  }
  xhrGet('weather.json?t=' + Date.now(), ok, function () {
    xhrGet('https' + q, ok, fail);
  });
}

function renderWeather(d) {
  var now = new Date(), dl = d.daily, html = '', i, j, hr, hi, idx = -1, di = 0, code, t, night, info;
  var nowStr = dayKey(now) + 'T' + pad(now.getHours()) + ':00';
  for (i = 0; i < d.hourly.time.length; i++) if (d.hourly.time[i] === nowStr) { idx = i; break; }
  if (dl.time) for (i = 0; i < dl.time.length; i++) if (dl.time[i] === dayKey(now)) { di = i; break; }
  /* usa a previsão da hora atual (funciona mesmo se o arquivo tiver algumas horas) */
  if (idx >= 0) { t = Math.round(d.hourly.temperature_2m[idx]); code = d.hourly.weather_code[idx]; night = now.getHours() < 6 || now.getHours() >= 18; }
  else { t = Math.round(d.current.temperature_2m); code = d.current.weather_code; night = d.current.is_day === 0; }
  info = wInfo(code, night);

  html += '<div class="label">' + esc(CONFIG.cidade) + '</div><div class="w-upd">' + (d._upd ? 'dados das ' + d._upd : '') + '</div>';
  html += '<div class="w-main"><div class="w-ico">' + info[0] + '</div><div class="w-temp">' + t + '°</div></div>';
  html += '<div class="w-desc">' + info[1] + '</div>';
  html += '<div class="w-mm">Máx ' + Math.round(dl.temperature_2m_max[di]) + '° · Mín ' + Math.round(dl.temperature_2m_min[di]) + '° · Chuva ' + dl.precipitation_probability_max[di] + '%</div>';
  if (idx >= 0) {
    html += '<div class="w-hours">';
    for (i = 1; i <= 4; i++) {
      j = idx + i * 3;
      if (j >= d.hourly.time.length) break;
      hr = parseInt(d.hourly.time[j].substr(11, 2), 10);
      hi = wInfo(d.hourly.weather_code[j], hr < 6 || hr >= 18);
      html += '<div class="w-h"><div>' + pad(hr) + 'h</div><div class="e">' + hi[0] + '</div><div>' + Math.round(d.hourly.temperature_2m[j]) + '°</div>' +
        '<div class="p">' + d.hourly.precipitation_probability[j] + '%</div></div>';
    }
    html += '</div>';
  }
  $('weather').className = 'card weather' + (night ? ' night' : '');
  $('weather').innerHTML = html;
  $('miniWeather').innerHTML = info[0] + ' ' + t + '°';
}

/* =====================================================================
   Som
   ===================================================================== */
var actx = null;
function unlockAudio() {
  try {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      var b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource();
      s.buffer = b; s.connect(actx.destination);
      if (s.start) s.start(0); else s.noteOn(0);
    }
    if (actx.resume && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function beep(at, freq) {
  try {
    var o = actx.createOscillator();
    var g = actx.createGain ? actx.createGain() : actx.createGainNode();
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.7, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.35);
    o.connect(g); g.connect(actx.destination);
    if (o.start) { o.start(at); o.stop(at + 0.4); } else { o.noteOn(at); o.noteOff(at + 0.4); }
  } catch (e) {}
}
var alarmLoop = null, alarmStop = null;
function fireAlarm() {
  $('alarm').className = 'alarm tap';
  function ring() {
    if (!actx) return;
    var t = actx.currentTime + 0.05;
    beep(t, 880); beep(t + 0.45, 880); beep(t + 0.9, 1175);
  }
  ring();
  alarmLoop = setInterval(ring, 1800);
  alarmStop = setTimeout(stopAlarm, 120000);
}
function stopAlarm() {
  if (alarmLoop) clearInterval(alarmLoop);
  if (alarmStop) clearTimeout(alarmStop);
  alarmLoop = alarmStop = null;
  $('alarm').className = 'alarm hidden tap';
}

/* =====================================================================
   Timer
   ===================================================================== */
var PRESETS = [1, 3, 5, 10, 15, 20, 30, 60];
var T = { state: 'idle', end: 0, left: 0, total: 0 };
function fmtLeft(ms) {
  var s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h > 0 ? h + ':' + pad(m) + ':' + pad(ss) : pad(m) + ':' + pad(ss);
}
function presetLabel(m) { return m >= 60 ? (m / 60) + ' h' : m + ' min'; }
function renderTimer() {
  var box = $('timerCard'), html, i, btns;
  if (T.state === 'idle') {
    html = '<div class="label">⏱ Timer</div><div class="t-grid">';
    for (i = 0; i < PRESETS.length; i++) {
      if (i % 4 === 0) html += (i ? '</div>' : '') + '<div class="t-row">';
      html += '<div class="t-btn tap" data-min="' + PRESETS[i] + '"><div>' + presetLabel(PRESETS[i]) + '</div></div>';
    }
    html += '</div></div>';
    box.className = 'card timer';
    box.innerHTML = html;
    btns = box.getElementsByClassName('t-btn');
    for (i = 0; i < btns.length; i++) {
      btns[i].onclick = (function (min) { return function () { startTimer(min); }; })(parseInt(btns[i].getAttribute('data-min'), 10));
    }
  } else {
    html = '<div class="label">⏱ Timer</div><div class="t-run"><div id="tLeft"></div>' +
      '<div class="t-sub" id="tSub"></div><div class="t-bar"><div id="tBar"></div></div>' +
      '<div class="t-acts"><div class="t-act tap" id="tPlus">+1 min</div>' +
      '<div class="t-act tap" id="tPause">' + (T.state === 'run' ? 'Pausar' : 'Continuar') + '</div>' +
      '<div class="t-act stop tap" id="tCancel">Cancelar</div></div></div>';
    box.className = 'card timer' + (T.state === 'pause' ? ' paused' : '');
    box.innerHTML = html;
    $('tPlus').onclick = plusMinute;
    $('tPause').onclick = togglePause;
    $('tCancel').onclick = cancelTimer;
    updateTimerText();
  }
}
function updateTimerText() {
  if (T.state === 'idle' || !$('tLeft')) return;
  var left = T.state === 'run' ? T.end - Date.now() : T.left;
  $('tLeft').innerHTML = fmtLeft(left);
  $('tSub').innerHTML = (T.state === 'pause' ? 'Pausado · ' : '') + 'de ' + fmtLeft(T.total);
  $('tBar').style.width = Math.max(0, Math.min(100, left / T.total * 100)) + '%';
}
function startTimer(min) { unlockAudio(); T.total = min * 60000; T.end = Date.now() + T.total; T.state = 'run'; renderTimer(); }
function plusMinute() { if (T.state === 'run') T.end += 60000; else T.left += 60000; T.total += 60000; updateTimerText(); }
function togglePause() {
  if (T.state === 'run') { T.left = T.end - Date.now(); T.state = 'pause'; }
  else { T.end = Date.now() + T.left; T.state = 'run'; }
  renderTimer();
}
function cancelTimer() { T.state = 'idle'; renderTimer(); }
function timerTick() {
  if (T.state !== 'run') return;
  if (T.end - Date.now() <= 0) { T.state = 'idle'; renderTimer(); fireAlarm(); }
  else updateTimerText();
}

/* =====================================================================
   Loop principal
   ===================================================================== */
var lastMinute = -1, lastDay = '';
function tick() {
  var now = new Date(), dk;
  if (now.getMinutes() !== lastMinute) {
    lastMinute = now.getMinutes();
    updateClock(now);
    dk = dayKey(now);
    if (dk !== lastDay) {
      if (lastDay) { buildSlides(); }
      lastDay = dk; undoArmed = {}; cleanupOldDays();
    }
    renderMeds();
    renderMeal();
    if (now.getHours() === 3 && now.getMinutes() === 30 && T.state === 'idle') location.reload();
  }
  timerTick();
}

/* Atualização automática: recarrega quando o GitHub publica uma versão nova */
var currentVersion = null;
function checkVersion() {
  xhrGet('version.json?t=' + Date.now(), function (v) {
    if (!v || !v.v) return;
    if (currentVersion === null) { currentVersion = v.v; return; }
    if (v.v !== currentVersion && T.state === 'idle' && !modalOpen) location.reload(true);
  }, function () {});
}

function fitHeight() { $('app').style.height = window.innerHeight + 'px'; }

function init() {
  fitHeight();
  window.addEventListener('resize', fitHeight, false);
  window.addEventListener('orientationchange', function () { setTimeout(fitHeight, 300); }, false);
  document.addEventListener('touchend', unlockAudio, false);

  buildSlides();
  slideTimer = setInterval(function () { if (!modalOpen) showSlide(slideIdx + 1); }, CONFIG.segundosPorReceita * 1000);
  $('hero').onclick = function () { openRecipe(slideList[slideIdx].id, new Date().getDay()); };
  $('meal').onclick = function () { openMenu(new Date().getDay()); };
  $('histLink').onclick = openHistory;
  $('modal').onclick = function (e) { if (e.target === $('modal')) closeSheet(); };
  $('alarm').onclick = stopAlarm;

  renderTimer();
  tick();
  setInterval(tick, 500);

  var cached = lsGet('cozinha-weather');
  if (cached) { try { renderWeather(JSON.parse(cached)); } catch (e) {} }
  loadWeather();
  setInterval(loadWeather, CONFIG.atualizarTempoMinutos * 60000);
  checkVersion();
  setInterval(checkVersion, 10 * 60000);
}

init();
</script>
